<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MilteHain — Create Your Account</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{
background:
radial-gradient(circle at 8% 12%,rgba(255,145,177,.15),transparent 18%),
radial-gradient(circle at 92% 85%,rgba(255,185,79,.13),transparent 20%),
linear-gradient(135deg,#fdfcff 0%,#f7f7ff 55%,#fffaf7 100%);
color:#17234b;
}
button,input,select{font:inherit}
button{cursor:pointer}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
.auth-card{
width:min(100%,610px);min-height:700px;position:relative;overflow:hidden;
background:rgba(255,255,255,.95);border:1px solid #dfe7f3;border-radius:18px;
box-shadow:0 10px 35px rgba(35,56,100,.12);padding:28px 44px 25px;
}
.heart{position:absolute;font-size:54px;color:#f9b7c9;opacity:.22;line-height:1;pointer-events:none}
.h1{top:32px;left:18px}.h2{top:30px;right:18px;font-size:48px}
.h3{bottom:24px;left:15px;font-size:45px}.h4{bottom:20px;right:18px;font-size:35px;color:#efb84f}
.brand{text-align:center;position:relative;z-index:2}
.logo{width:176px;height:auto;display:block;margin:0 auto 12px}
.heading{font:700 27px Georgia,"Times New Roman",serif;color:#17245a;margin:0 0 6px}
.subheading{font-size:14px;color:#6d7b99;margin:0 0 22px}
.tabs{display:grid;grid-template-columns:1fr 1fr;height:46px;border:1px solid #dce4ef;border-radius:9px;overflow:hidden;margin-bottom:22px;position:relative;z-index:2}
.tab{border:0;background:#fff;color:#33446b;font-weight:700}
.tab.active{color:#fff;background:linear-gradient(100deg,#4f16e8,#7a29f6);box-shadow:0 4px 12px rgba(91,20,230,.22)}
.form{position:relative;z-index:2}
.field{position:relative;margin-bottom:12px}
.field input{width:100%;height:56px;border:1px solid #dce4ef;border-radius:9px;background:#fff;padding:19px 14px 5px 50px;outline:none;color:#17234b}
.field input:focus,.select:focus{border-color:#7040ee;box-shadow:0 0 0 3px rgba(112,64,238,.08)}
.field label{position:absolute;left:50px;top:7px;font-size:10px;white-space:nowrap;font-weight:700;color:#7382a0;z-index:1}
.icon{position:absolute;left:16px;top:17px;color:#596d99;font-size:20px;z-index:1}
.password-eye{position:absolute;right:15px;top:18px;color:#6f7d9a;font-size:18px}
.section-label{font-size:12px;font-weight:700;color:#33446b;margin:12px 0 7px}
.gender{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
.gender label{height:47px;border:1px solid #dce4ef;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#33446b;font-weight:700;background:#fff}
.gender input{display:none}
.gender input:checked+span{color:#5b20e8}
.gender label:has(input:checked){border-color:#9d7cff;box-shadow:0 0 0 2px rgba(124,65,242,.08)}
.dob{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}
.select{width:100%;height:47px;border:1px solid #dce4ef;border-radius:9px;background:#fff;padding:0 12px;color:#596b8d;outline:none}
.checks{margin:14px 0 8px;display:grid;gap:9px}
.check{display:flex;align-items:flex-start;gap:8px;color:#596b8d;font-size:11px;line-height:1.45}
.check input{width:17px;height:17px;margin:1px 0 0;accent-color:#5d20e8;flex:0 0 auto}
.check a,.below a{color:#4f20dc;font-weight:700}
.main-btn{width:100%;height:53px;border:0;border-radius:10px;background:linear-gradient(100deg,#4e16e8,#7d2cf7);color:#fff;font-weight:700;font-size:16px;box-shadow:0 7px 18px rgba(82,25,222,.22);margin-top:10px}
.below{text-align:center;color:#5f6e8d;font-size:12px;margin:16px 0 0}
@media(max-width:620px){
.auth-card{padding:25px 22px 22px;min-height:100vh;border-radius:0;border-left:0;border-right:0}
.heading{font-size:28px}.logo{width:155px}
}
</style>
</head>
<body>
<div class="page">
<section class="auth-card">
<div class="heart h1">♥</div><div class="heart h2">♥</div><div class="heart h3">♥</div><div class="heart h4">♥</div>

<div class="brand">

<h1 class="heading">Create Your Account</h1>
<p class="subheading">Step into a world of meaningful connections</p>
</div>

<div class="tabs">
<button class="tab active" type="button">Register</button>
<button class="tab" type="button" onclick="location.href='login.html'">Login</button>
</div>

<form class="form" id="registerForm">
<div class="field">
<span class="icon">♙</span><label for="name">Full Name</label>
<input id="name" name="name" type="text" placeholder="Enter your full name" required>
</div>

<div class="field">
<span class="icon">✉</span><label for="email">Email Address</label>
<input id="email" name="email" type="email" placeholder="Enter your email address" required>
</div>

<div class="field">
<span class="icon">▯</span>
<label for="mobile" style="white-space:nowrap">Mobile Number <span style="font-weight:600;color:#8a96aa">(Optional)</span></label>
<input id="mobile" name="mobile" type="tel" placeholder="Enter your mobile number (optional)">
</div>

<div class="field">
<span class="icon">♙</span><label for="password">Password</label>
<input id="password" name="password" type="password" placeholder="Create a strong password" minlength="8" required>
<span class="password-eye">◉</span>
</div>

<div class="section-label">Gender</div>
<div class="gender">
<label><input type="radio" name="gender" value="Male" required><span>Male</span></label>
<label><input type="radio" name="gender" value="Female"><span>Female</span></label>
</div>

<div class="section-label">Date of Birth</div>
<div class="dob">
<select class="select" name="dob_day" required>
<option value="">DD</option>
<option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option><option>13</option><option>14</option><option>15</option><option>16</option><option>17</option><option>18</option><option>19</option><option>20</option><option>21</option><option>22</option><option>23</option><option>24</option><option>25</option><option>26</option><option>27</option><option>28</option><option>29</option><option>30</option><option>31</option>
</select>

<select class="select" name="dob_month" required>
<option value="">MM</option>
<option>01</option><option>02</option><option>03</option><option>04</option><option>05</option><option>06</option><option>07</option><option>08</option><option>09</option><option>10</option><option>11</option><option>12</option>
</select>

<select class="select" name="dob_year" required>
<option value="">YYYY</option>
<option>2008</option><option>2007</option><option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option><option>2001</option><option>2000</option><option>1999</option><option>1998</option><option>1997</option><option>1996</option><option>1995</option><option>1994</option><option>1993</option><option>1992</option><option>1991</option><option>1990</option><option>1989</option><option>1988</option><option>1987</option><option>1986</option><option>1985</option><option>1984</option><option>1983</option><option>1982</option><option>1981</option><option>1980</option><option>1979</option><option>1978</option><option>1977</option><option>1976</option><option>1975</option><option>1974</option><option>1973</option><option>1972</option><option>1971</option><option>1970</option><option>1969</option><option>1968</option><option>1967</option><option>1966</option><option>1965</option><option>1964</option><option>1963</option><option>1962</option><option>1961</option><option>1960</option><option>1959</option><option>1958</option><option>1957</option><option>1956</option><option>1955</option><option>1954</option><option>1953</option><option>1952</option><option>1951</option><option>1950</option><option>1949</option><option>1948</option><option>1947</option><option>1946</option><option>1945</option><option>1944</option><option>1943</option><option>1942</option><option>1941</option><option>1940</option>
</select>
</div>

<div class="checks">
<label class="check">
<input type="checkbox" required>
<span>I confirm that I am <strong>18 years or older</strong>.</span>
</label>

<label class="check">
<input type="checkbox" required>
<span>I agree to the <a href="#" onclick="return false">Terms &amp; Conditions</a> and <a href="#" onclick="return false">Privacy Policy</a>.</span>
</label>
</div>

<button class="main-btn" type="submit">Create Account</button>

<p class="below">Already have an account? <a href="login.html">Login</a></p>
</form>
</section>
</div>

<script>
document.getElementById('registerForm').addEventListener('submit',function(e){
e.preventDefault();
if(!this.checkValidity()){this.reportValidity();return;}
window.location.href='profile-setup.html';
});
</script>
</body>
</html>
