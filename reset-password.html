<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reset Password - MilteHain</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#090b24,#17103d 55%,#2b0c32);font-family:Arial,sans-serif;color:#fff;padding:20px}
.card{width:min(420px,100%);background:rgba(255,255,255,.96);color:#17132f;border-radius:24px;padding:32px;box-sizing:border-box;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{text-align:center;margin:0 0 8px;color:#24104d}
p{text-align:center;color:#666}
label{display:block;margin:18px 0 7px;font-weight:600}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#7a3cff,#d52f9d);color:white;font-size:16px;font-weight:700}
</style>
</head>
<body>
<div class="card">
<h1>Set New Password</h1>
<p>Enter your new password below.</p>
<form id="resetForm">
<label for="newPassword">New Password</label>
<input id="newPassword" type="password" minlength="6" required placeholder="Enter new password">
<label for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" type="password" minlength="6" required placeholder="Confirm new password">
<button type="submit">Update Password</button>
</form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
const client = supabase.createClient(window.MILTEHAIN_SUPABASE_URL, window.MILTEHAIN_SUPABASE_PUBLISHABLE_KEY);

document.getElementById('resetForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  if(password !== confirm){
    alert('Passwords do not match.');
    return;
  }
  const { error } = await client.auth.updateUser({ password });
  if(error){
    alert(error.message);
    return;
  }
  alert('Password updated successfully. Please login again.');
  window.location.href = 'login.html';
});
</script>
</body>
</html>
